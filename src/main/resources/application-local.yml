# Local Development Configuration
# Activated with: --spring.profiles.active=local

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/encryption_db?useSSL=false&allowPublicKeyRetrieval=true
    username: encryptuser
    password: encryptpass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true  # Show SQL in console for debugging

# AWS Cognito Configuration (for local development)
# Get these values from AWS Console after Cognito is deployed
aws:
  cognito:
    region: ${AWS_REGION:us-east-1}
    user-pool-id: ${COGNITO_USER_POOL_ID:}  # Set via environment variable
    client-id: ${COGNITO_CLIENT_ID:}        # Set via environment variable

# Encryption Configuration (for local development only)
# In production, this will be loaded from AWS Secrets Manager
encryption:
  # This is a base64-encoded 256-bit key for local development
  # Generated with: openssl rand 32 | base64
  master-key: ${ENCRYPTION_MASTER_KEY:p40/SR/ghInf8D27oo9TuvZrTbY+tjBJW3nMNkX/8i4=}

logging:
  level:
    com.aviencryption: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
