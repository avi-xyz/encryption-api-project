# Default Spring Boot Configuration
# This file contains common settings across all environments

spring:
  application:
    name: encryption-api

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate  # Changed to validate - use Flyway for migrations
    show-sql: false       # Set to true for debugging SQL queries
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # Database Connection Pool
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Async Configuration (for audit logging)
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
        queue-capacity: 100
      thread-name-prefix: async-audit-

# Server Configuration
server:
  port: 8080
  shutdown: graceful  # Graceful shutdown for containers

# Actuator Endpoints (Health Checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

# Logging
logging:
  level:
    com.aviencryption: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.springframework.security: INFO

# AWS Cognito Configuration
# These values should be overridden in environment-specific configs or environment variables
aws:
  cognito:
    region: ${AWS_REGION:us-east-1}
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    client-id: ${COGNITO_CLIENT_ID:}

# Encryption Configuration
# Master key should be stored in AWS Secrets Manager in production
encryption:
  master-key: ${ENCRYPTION_MASTER_KEY:}
